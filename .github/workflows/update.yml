name: Sargassum forecast update

on:
  schedule:
    # every 3 hours
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sargassum-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forecast
        run: python scripts/update.py

      - name: Commit outputs
        run: |
          git config user.name  "sargassum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ data/archive/
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Automated update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
