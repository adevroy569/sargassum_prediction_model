name: Backfill training data

# Long one-off job: downloads the AFAI history and rebuilds the training
# table, then retrains the model. Run manually.
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First date to backfill (YYYY-MM-DD)'
        required: false
        default: '2020-10-01'
      limit:
        description: 'Max scenes (0 = all)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill
        run: |
          python scripts/backfill.py \
            --start "${{ github.event.inputs.start }}" \
            --limit "${{ github.event.inputs.limit }}"

      - name: Train model
        run: python scripts/train_model.py

      - name: Commit training data and model
        run: |
          git config user.name  "sargassum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/ data/models/
          git diff --cached --quiet || (git commit -m "Backfill training data and retrain model" && git pull --rebase --autostash && git push)
