name: Weekly retrain

on:
  schedule:
    - cron: '40 6 * * 1'   # Mondays 06:40 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Extend training table with the last few weeks
        run: python scripts/backfill.py --limit 12
      - name: Retrain
        run: python scripts/train_model.py --allow-empty
      - name: Commit
        run: |
          git config user.name  "sargassum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ 
          git diff --cached --quiet || (git commit -m "Weekly retrain" && git pull --rebase --autostash && git push)
